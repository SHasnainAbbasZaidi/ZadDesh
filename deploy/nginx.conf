# Replace the domain and certificate paths. Proxy and backend must be on the same host.
server {
    listen 80;
    server_name zaddesh.example.com;
    return 301 https://zaddesh.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name zaddesh.example.com;
    ssl_certificate /etc/letsencrypt/live/zaddesh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaddesh.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
